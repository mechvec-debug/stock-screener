name: Daily Post-Market Screener

on:
  schedule:
    # 11:00 UTC is exactly 16:30 IST. Runs Monday through Friday (1-5).
    - cron: '0 11 * * 1-5'
  workflow_dispatch: # Allows you to manually trigger it from the GitHub website

jobs:
  run-screener:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12' 

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create Google Credentials JSON
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: echo "$GCP_CREDENTIALS" > credentials.json
sheet = get_google_sheet("Stock_List")
      - name: Run Daily Scan
        run: python scheduler/daily_scan.py
